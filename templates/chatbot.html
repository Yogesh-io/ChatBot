{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot</title>
    <link rel="stylesheet" href="{% static 'static/css/style.css' %}">
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <h2>AI Assistant</h2>
        <a href="{% url 'clear_chat' %}" class="clear-btn">Clear Chat</a>
    </div>

    <div class="chat-box">
        {% for message in conversations %}
            <div class="message {% if message.role == 'user' %} user {% else %}assistant{% endif %}">
                {{ message.content|linebreaksbr }}
            </div>
        {% empty %}
            <div class="message assistant">How Can I Help You!</div>
        {% endfor %}
    </div>

    <div class="input-area">
        <form method="POST" action="{% url 'chatbot' %}" class="input-form">
            {% csrf_token %}
            <input type="text" name="message" placeholder="Type your message here..." required autofocus autocomplete="off">
            <button type="submit">Send</button>
        </form>
    </div>
</div>

</body>
</html>
